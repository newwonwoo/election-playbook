<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4' fill='%2322c55e'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캡컷 에이전트</title>
<style>
:root{
  --bg:#0a0a0a; --card:#161616; --line:#232323; --line2:#2e2e2e;
  --text:#ededed; --mute:#8a8a8a; --dim:#5c5c5c; --acc:#22c55e; --acc-dim:#14532d; --warn:#f59e0b; --err:#ef4444;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
h1 small{color:var(--mute);font-weight:400;font-size:13px;margin-left:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;font:12px var(--mono);color:var(--mute);padding:4px 10px;border:1px solid var(--line);border-radius:999px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.dot.bad{background:var(--err);box-shadow:0 0 8px var(--err)}
.dot.run{background:var(--acc);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
h2{font-size:12px;font-weight:500;color:var(--mute);letter-spacing:.04em;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.hide{display:none!important}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line2);border-radius:7px;padding:7px 14px;cursor:pointer;transition:border-color .12s,background .12s}
button:hover{border-color:var(--mute)}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);border-color:var(--acc);color:#04210f;font-weight:600}
button.pri:hover{background:#4ade80;border-color:#4ade80}
button:disabled{opacity:.4;cursor:default}
code,.code{font:12px var(--mono);background:#0f0f0f;border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--mute);word-break:break-all}

/* 업로드 */
#drop{margin-top:28px;border:1px dashed var(--line2);border-radius:12px;padding:64px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;position:relative;overflow:hidden}
#drop:hover,#drop.over{border-color:var(--acc);background:#0d130f}
#drop svg{width:26px;height:26px;stroke:var(--mute);margin-bottom:12px}
#drop b{display:block;font-weight:500;margin-bottom:4px}
#drop span{color:var(--dim);font-size:12px}
#bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--acc);transition:width .1s}
details{margin-top:14px}
summary{cursor:pointer;color:var(--mute);font-size:13px;width:max-content;padding:4px 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute)}
label.f input[type=number],label.f select{background:#0f0f0f;color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;font:13px var(--mono)}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:13px}
.hint{color:var(--dim);font-size:12px}

/* 진행 */
#proc{margin-top:28px;max-width:560px}
.step{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);color:var(--dim);transition:color .2s}
.step:last-child{border-bottom:0}
.step.run,.step.done{color:var(--text)}
.step .t{font:12px var(--mono);color:var(--mute)}
.fname{font:13px var(--mono);color:var(--mute);margin-bottom:14px;word-break:break-all}
#err{margin-top:14px;color:var(--err);font-size:13px}

/* 결과 */
#res{margin-top:24px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:20px;align-items:start}
@media(max-width:900px){#res{grid-template-columns:1fr}}
video{width:100%;max-height:52vh;background:#000;border-radius:8px;display:block}
.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pbar .sp{flex:1}
.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px}
.sw{width:30px;height:17px;border-radius:9px;background:var(--line2);position:relative;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#bbb;transition:transform .15s}
.tog[aria-checked=true] .sw{background:var(--acc)}
.tog[aria-checked=true] .sw::after{transform:translateX(13px);background:#04210f}
canvas{width:100%;height:84px;display:block;margin-top:14px;cursor:pointer;border-radius:6px}
.tc{font:12px var(--mono);color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.stats>div{padding:0 14px;border-left:1px solid var(--line)}
.stats>div:first-child{padding-left:0;border-left:0}
.stats .n{font-size:22px;font-weight:600;letter-spacing:-.02em}
.stats .l{font-size:12px;color:var(--mute)}
.stats .n.g{color:var(--acc)}
#cutlist{max-height:300px;overflow:auto;margin:0 -8px}
.cut{display:grid;grid-template-columns:auto 54px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.cut:hover{background:#1c1c1c}
.cut.off{color:var(--dim)}
.cut.off .lb{text-decoration:line-through}
.cut .k{font:11px var(--mono);color:var(--mute);border:1px solid var(--line2);border-radius:4px;padding:0 6px;text-align:center}
.cut .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cut .t{font:12px var(--mono);color:var(--mute)}
.cb{width:14px;height:14px;border:1px solid var(--line2);border-radius:4px;display:inline-block;flex:none}
.cut:not(.off) .cb{background:var(--acc);border-color:var(--acc)}
.cut.act{background:#1a1a1a}
.marks{display:flex;gap:6px;flex-wrap:wrap}
.mk{font:12px var(--mono);border:1px solid var(--acc-dim);color:var(--acc);border-radius:5px;padding:1px 8px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.keys{font-size:12px;color:var(--dim)}
kbd{font:11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--mute)}
#tr{grid-column:1/-1}
#trbody{line-height:2.1;max-height:260px;overflow:auto}
#trbody .seg{display:block;margin-bottom:6px}
#trbody .ts{font:11px var(--mono);color:var(--dim);margin-right:8px}
.w{cursor:pointer;padding:1px 2px;border-radius:3px}
.w:hover{background:#222}
.w.cutw{color:var(--dim);text-decoration:line-through}
.w.now{background:var(--acc-dim);color:#fff}
.stack>*+*{margin-top:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1c1c;border:1px solid var(--line2);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>캡컷 에이전트<small>한국어 토킹 영상 자동 컷 + 자막 → 캡컷 드래프트</small></h1>
    <div class="chips" id="chips" aria-label="환경 점검"></div>
  </header>

  <!-- 1. 업로드 -->
  <section id="s-idle">
    <div id="drop" tabindex="0" role="button" aria-label="영상 파일 선택">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <b>영상 파일을 드래그하거나 클릭해서 선택</b>
      <span>.mp4 .mov · 최대 500MB</span>
      <div id="bar"></div>
      <input type="file" id="file" accept=".mp4,.mov,.m4v,video/mp4,video/quicktime" class="hide">
    </div>
    <details>
      <summary>처리 옵션</summary>
      <div class="opts">
        <label class="f">음성 인식 모델
          <select id="o-model"><option>tiny</option><option>base</option><option selected>small</option><option>medium</option><option>large-v3</option></select>
          <span class="hint">클수록 정확·느림. 처음엔 small 권장</span></label>
        <label class="f">무음 기준 (dB)
          <input type="number" id="o-thr" placeholder="자동 (권장)" min="-60" max="-20" step="1">
          <span class="hint">비우면 배경 소음에 맞춰 자동 조정</span></label>
        <label class="f">최소 무음 길이 (초)
          <input type="number" id="o-min" value="0.4" min="0.2" max="2" step="0.05"></label>
        <label class="f">컷 경계 여유 (초)
          <input type="number" id="o-pad" value="0.12" min="0" max="0.4" step="0.02">
          <span class="hint">말 앞뒤에 남기는 숨쉬기. 0이면 딱딱함</span></label>
        <label class="f chk"><input type="checkbox" id="o-agg"> 공격적 잔말 제거 (그, 뭐, 막, 이제…)</label>
        <label class="f chk"><input type="checkbox" id="o-sub" checked> 자막 생성</label>
      </div>
    </details>
  </section>

  <!-- 2. 진행 -->
  <section id="s-proc" class="hide">
    <div id="proc" class="card">
      <div class="fname" id="pname"></div>
      <div id="steps"></div>
      <div id="err"></div>
      <button id="retry" class="hide" style="margin-top:14px">처음으로</button>
    </div>
  </section>

  <!-- 3. 결과 -->
  <section id="s-res" class="hide">
    <div id="res">
      <div class="card">
        <video id="vid" controls playsinline preload="metadata"></video>
        <canvas id="tl" aria-label="타임라인: 클릭하면 이동"></canvas>
        <div class="pbar">
          <span class="tc" id="tc">0:00 / 0:00</span>
          <span class="sp"></span>
          <div class="tog" id="skip" role="switch" aria-checked="true" tabindex="0"><span class="sw"></span>컷 건너뛰며 재생 <kbd>S</kbd></div>
        </div>
        <hr>
        <div class="row keys">
          <span><kbd>Space</kbd> 재생</span><span><kbd>←</kbd><kbd>→</kbd> 1초</span>
          <span><kbd>[</kbd> <kbd>]</kbd> 이 구간은 살린다</span>
        </div>
        <div class="marks" id="marks" style="margin-top:10px"></div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="stats">
            <div><div class="n" id="st-orig">-</div><div class="l">원본</div></div>
            <div><div class="n g" id="st-out">-</div><div class="l">결과</div></div>
            <div><div class="n" id="st-save">-</div><div class="l">절약</div></div>
          </div>
          <hr>
          <div class="row" style="justify-content:space-between">
            <h2 style="margin:0">컷 목록 <span id="cutn" class="tc"></span></h2>
            <span class="hint">클릭으로 살리기/자르기</span>
          </div>
          <div id="cutlist" style="margin-top:8px"></div>
        </div>
        <div class="card">
          <div class="row"><button class="pri" id="apply" disabled>드래프트 갱신</button>
            <a id="srt" href="#"><button type="button">SRT 받기</button></a>
            <button id="again">새 영상</button></div>
          <hr>
          <h2>캡컷 드래프트</h2>
          <div class="row"><code id="dpath"></code><button id="copy">복사</button></div>
          <p class="hint" style="margin-top:10px">캡컷을 다시 열면 프로젝트 목록에 나타납니다. 최종 검증은 캡컷에서 직접 재생해서 확인하세요.</p>
          <p class="hint" id="asrinfo" style="margin-top:6px"></p>
        </div>
      </div>

      <div class="card" id="tr">
        <h2>대본 <span class="hint">단어를 클릭하면 그 지점으로 이동 · 취소선 = 잘리는 부분</span></h2>
        <div id="trbody"></div>
      </div>
    </div>
  </section>
</div>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const fmt = t => { t = Math.max(0, t); return Math.floor(t/60) + ":" + String(Math.floor(t%60)).padStart(2,"0"); };
const fmt1 = t => t.toFixed(1) + "s";
const KIND = {silence:"무음", filler:"잔말", ng:"NG"};
const MIN_KEEP = 0.35;                       // 서버(cuts.compute_keep)와 동일
let S = {job:null, res:null, cuts:[], marks:[], markStart:null, skip:true, words:[], dirty:false};

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),2200); }
function show(id){ for (const s of ["idle","proc","res"]) $("#s-"+s).classList.toggle("hide", s!==id); }

/* ---------- 환경 점검 (Step 0) ---------- */
fetch("/api/env").then(r=>r.json()).then(e=>{
  const names = {ffmpeg:"ffmpeg", pycapcut:"pycapcut", capcut:"CapCut", disk:"디스크"};
  const chips = [`<span class="chip"><i class="dot ok"></i>${e.os} ${e.arch} · 트랙 ${e.track}</span>`,
                 `<span class="chip"><i class="dot ok"></i>${e.backend}</span>`];
  for (const i of e.items) chips.push(`<span class="chip" title="${i.detail.replace(/"/g,"&quot;")}"><i class="dot ${i.ok?"ok":"bad"}"></i>${names[i.key]}</span>`);
  $("#chips").innerHTML = chips.join("");
  if (!e.ready) toast("필수 도구가 빠져 있어요: " + e.items.filter(i=>!i.ok&&["ffmpeg","pycapcut"].includes(i.key)).map(i=>i.detail).join(", "));
});

/* ---------- 업로드 ---------- */
const drop = $("#drop"), fileIn = $("#file");
drop.onclick = () => fileIn.click();
drop.onkeydown = e => { if (e.key==="Enter"||e.key===" ") { e.preventDefault(); fileIn.click(); } };
fileIn.onchange = () => fileIn.files[0] && start(fileIn.files[0]);
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; f && start(f); });

function start(file){
  if (!/\.(mp4|mov|m4v)$/i.test(file.name)) return toast("mp4 / mov 파일만 지원해요");
  if (file.size > 500*1024*1024) return toast("최대 500MB까지 지원해요");
  const fd = new FormData();
  fd.append("file", file);
  fd.append("model", $("#o-model").value);
  if ($("#o-thr").value !== "") fd.append("threshold_db", $("#o-thr").value);
  fd.append("min_silence", $("#o-min").value);
  fd.append("pad", $("#o-pad").value);
  fd.append("aggressive", $("#o-agg").checked);
  fd.append("subtitles", $("#o-sub").checked);
  const x = new XMLHttpRequest();
  x.open("POST", "/api/jobs");
  x.upload.onprogress = e => { if (e.lengthComputable) $("#bar").style.width = (e.loaded/e.total*100) + "%"; };
  x.onload = () => {
    $("#bar").style.width = "0";
    if (x.status !== 200) { let m = "업로드 실패"; try { m = JSON.parse(x.responseText).detail || m; } catch(_){} return toast(m); }
    watch(JSON.parse(x.responseText).id, file.name);
  };
  x.onerror = () => toast("서버에 연결할 수 없어요");
  x.send(fd);
}

/* ---------- 진행 (SSE stepper) ---------- */
const STEPS = [["silence","무음 감지"],["asr","음성 인식 (전체 대본 추출)"],["filler","잔말·NG 판정"],["draft","캡컷 드래프트 생성"]];
function renderSteps(state){
  $("#steps").innerHTML = STEPS.map(([k,l]) => {
    const s = state[k] || {}; const cls = s.state || "";
    const dot = cls==="done" ? "ok" : cls==="running" ? "run" : "";
    const t = cls==="done" ? s.sec.toFixed(1)+"s" : cls==="running" ? "처리 중" : "대기";
    return `<div class="step ${cls==="running"?"run":cls}"><i class="dot ${dot}"></i><span>${l}</span><span class="t">${t}</span></div>`;
  }).join("");
}
function watch(id, name){
  S.job = id; show("proc"); $("#pname").textContent = name; $("#err").textContent = ""; $("#retry").classList.add("hide");
  const st = {}; renderSteps(st);
  const es = new EventSource(`/api/jobs/${id}/events`);
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.type === "stage") { st[ev.key] = ev; renderSteps(st); }
    else if (ev.type === "done") { es.close(); load(id); }
    else if (ev.type === "error") { es.close(); $("#err").textContent = "처리 실패 — " + ev.message; $("#retry").classList.remove("hide"); }
  };
  es.onerror = () => { /* 브라우저가 자동 재연결, 서버가 이벤트를 처음부터 리플레이 */ };
}
$("#retry").onclick = () => show("idle");

/* ---------- 결과 ---------- */
async function load(id){
  const j = await (await fetch(`/api/jobs/${id}`)).json();
  S.res = j.result; S.cuts = j.result.cuts.map(c=>({...c})); S.marks = j.result.keep_marks.map(m=>[...m]); S.dirty = false;
  const v = $("#vid"); v.src = `/api/jobs/${id}/video`;
  $("#srt").href = `/api/jobs/${id}/srt`;
  $("#dpath").textContent = S.res.draft_path;
  const a = S.res.asr; $("#asrinfo").textContent = `ASR ${a.backend} / ${a.model}${a.cached ? " (캐시 사용)" : ""} · 무음 기준 ${S.res.threshold_db}dB · 자막 ${S.res.subtitle_count}줄`;
  buildWords(); show("res"); refresh();
}

function computeKeep(){            // 서버 cuts.compute_keep과 동일 로직 → 토글 즉시 반영
  const D = S.res.duration;
  let keep = [[0,D]];
  for (const c of S.cuts.filter(c=>c.enabled).sort((a,b)=>a.start-b.start)){
    const nk = [];
    for (const [s,e] of keep){
      if (c.end <= s || c.start >= e) { nk.push([s,e]); continue; }
      if (c.start > s) nk.push([s,c.start]);
      if (c.end < e) nk.push([c.end,e]);
    }
    keep = nk;
  }
  keep = keep.concat(S.marks.map(([s,e])=>[Math.max(0,s),Math.min(D,e)])).sort((a,b)=>a[0]-b[0]);
  const m = [];
  for (const k of keep){ if (m.length && k[0] <= m[m.length-1][1]) m[m.length-1][1] = Math.max(m[m.length-1][1],k[1]); else m.push([...k]); }
  return m.filter(([s,e]) => e-s >= MIN_KEEP);
}
function inKeep(t){ return S.keep.some(([s,e]) => t>=s && t<=e); }

function refresh(){
  S.keep = computeKeep();
  const out = S.keep.reduce((a,[s,e])=>a+e-s,0), D = S.res.duration;
  $("#st-orig").textContent = fmt(D); $("#st-out").textContent = fmt(out);
  $("#st-save").textContent = Math.round((D-out)/D*100) + "%";
  $("#apply").disabled = !S.dirty;
  $("#apply").textContent = S.dirty ? "드래프트 갱신 (변경됨)" : "드래프트 갱신";
  renderCuts(); renderMarks(); markWords(); draw();
}

function renderCuts(){
  const n = S.cuts.filter(c=>c.enabled).length;
  $("#cutn").textContent = `${n}/${S.cuts.length}`;
  $("#cutlist").innerHTML = S.cuts.map(c => `
    <div class="cut ${c.enabled?"":"off"}" data-id="${c.id}" role="checkbox" aria-checked="${c.enabled}" tabindex="0">
      <i class="cb"></i><span class="k">${KIND[c.kind]}</span><span class="lb">${esc(c.label)}</span><span class="t">${fmt(c.start)}·${fmt1(c.end-c.start)}</span></div>`).join("")
    || `<p class="hint" style="padding:8px">자를 구간이 없어요</p>`;
}
function esc(s){ return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
$("#cutlist").addEventListener("click", e => {
  const el = e.target.closest(".cut"); if (!el) return;
  const c = S.cuts.find(c=>c.id==el.dataset.id); c.enabled = !c.enabled; S.dirty = true;
  if (!c.enabled) { $("#vid").currentTime = Math.max(0, c.start - 0.5); }     // 살린 부분을 바로 들어보게
  refresh();
});
$("#cutlist").addEventListener("keydown", e => { if (e.key===" "||e.key==="Enter") { e.preventDefault(); e.target.click(); } });

function renderMarks(){
  $("#marks").innerHTML = S.marks.map((m,i)=>`<span class="mk" data-i="${i}" title="클릭하면 삭제">살림 ${fmt1(m[0])}~${fmt1(m[1])} ✕</span>`).join("");
}
$("#marks").addEventListener("click", e => { const el=e.target.closest(".mk"); if(!el) return; S.marks.splice(+el.dataset.i,1); S.dirty=true; refresh(); });

$("#apply").onclick = async () => {
  const b = $("#apply"); b.disabled = true; b.textContent = "갱신 중…";
  const toggles = {}; S.cuts.forEach(c => toggles[c.id] = c.enabled);
  const r = await fetch(`/api/jobs/${S.job}/rebuild`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({toggles, keep_marks:S.marks})});
  if (!r.ok) { toast("갱신 실패"); return refresh(); }
  S.res = await r.json(); S.dirty = false; $("#dpath").textContent = S.res.draft_path;
  $("#asrinfo").textContent = $("#asrinfo").textContent.replace(/자막 \d+줄/, `자막 ${S.res.subtitle_count}줄`);
  toast("드래프트를 갱신했어요 (ASR 재실행 없음)"); refresh();
};
$("#copy").onclick = () => navigator.clipboard.writeText($("#dpath").textContent).then(()=>toast("경로를 복사했어요"), ()=>toast("복사 실패"));
$("#again").onclick = () => { $("#vid").pause(); show("idle"); fileIn.value = ""; };

/* ---------- 대본 ---------- */
function buildWords(){
  S.words = [];
  $("#trbody").innerHTML = S.res.transcript.segments.map(seg => `<span class="seg"><span class="ts">${fmt(seg.start)}</span>` +
    seg.words.map(w => { const i = S.words.push({...w}) - 1; return `<span class="w" data-i="${i}">${esc(w.text)}</span>`; }).join(" ") + "</span>").join("")
    || `<p class="hint">인식된 말이 없어요</p>`;
}
function markWords(){
  document.querySelectorAll(".w").forEach(el => { const w = S.words[el.dataset.i]; el.classList.toggle("cutw", !inKeep((w.start+w.end)/2)); });
}
$("#trbody").addEventListener("click", e => { const el=e.target.closest(".w"); if (el) $("#vid").currentTime = S.words[el.dataset.i].start; });

/* ---------- 타임라인 ---------- */
const cv = $("#tl"), ctx = cv.getContext("2d");
function draw(){
  if (!S.res) return;
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W*dpr) { cv.width = W*dpr; cv.height = H*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const D = S.res.duration, x = t => t/D*W, pk = S.res.peaks, mid = H/2;
  for (let i=0;i<pk.length;i++){
    const t = (i+.5)/pk.length*D, h = Math.max(1, pk[i]*(H-8));
    ctx.fillStyle = inKeep(t) ? "#22c55e" : "#2e2e2e";
    ctx.fillRect(i/pk.length*W, mid-h/2, Math.max(1, W/pk.length-.5), h);
  }
  for (const c of S.cuts) if (c.enabled) { ctx.fillStyle = "rgba(10,10,10,.35)"; ctx.fillRect(x(c.start),0,x(c.end)-x(c.start),H); }
  ctx.strokeStyle = "#22c55e"; ctx.lineWidth = 1;
  for (const [s,e] of S.marks) ctx.strokeRect(x(s)+.5, 1.5, x(e)-x(s), H-3);
  if (S.markStart != null) { ctx.fillStyle = "#f59e0b"; ctx.fillRect(x(S.markStart),0,2,H); }
  const t = $("#vid").currentTime || 0;
  ctx.fillStyle = "#fff"; ctx.fillRect(x(t)-1,0,2,H);
}
cv.addEventListener("click", e => { const r = cv.getBoundingClientRect(); $("#vid").currentTime = (e.clientX-r.left)/r.width*S.res.duration; });
addEventListener("resize", draw);

/* ---------- 재생 루프: 컷 건너뛰기 + 플레이헤드 + 현재 단어 ---------- */
const vid = $("#vid");
let lastNow = -1;
function tick(){
  if (S.res && !$("#s-res").classList.contains("hide")){
    const t = vid.currentTime;
    if (S.skip && !vid.paused && !inKeep(t)){
      const nxt = S.keep.find(([s]) => s > t);
      if (nxt) vid.currentTime = nxt[0]; else { vid.pause(); }
    }
    $("#tc").textContent = `${fmt(t)} / ${fmt(S.res.duration)}`;
    let idx = -1; for (let i=0;i<S.words.length;i++) if (S.words[i].start <= t && t < S.words[i].end + 0.05) { idx = i; break; }
    if (idx !== lastNow){
      document.querySelector(".w.now")?.classList.remove("now");
      if (idx >= 0){ const el = document.querySelector(`.w[data-i="${idx}"]`); el?.classList.add("now");
        if (!vid.paused) el?.scrollIntoView({block:"nearest"}); }
      lastNow = idx;
    }
    draw();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- 토글 & 단축키 ---------- */
function setSkip(v){ S.skip = v; $("#skip").setAttribute("aria-checked", v); }
$("#skip").onclick = () => setSkip(!S.skip);
$("#skip").onkeydown = e => { if (e.key===" "||e.key==="Enter") { e.preventDefault(); setSkip(!S.skip); } };
addEventListener("keydown", e => {
  if ($("#s-res").classList.contains("hide") || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.target.matches("[role=switch],[role=checkbox],button")) return;
  if (e.key === " ") { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
  else if (e.key === "ArrowLeft") vid.currentTime -= e.shiftKey ? 5 : 1;
  else if (e.key === "ArrowRight") vid.currentTime += e.shiftKey ? 5 : 1;
  else if (e.key === "s" || e.key === "S") setSkip(!S.skip);
  else if (e.key === "[") { S.markStart = vid.currentTime; toast("살릴 구간 시작 " + fmt1(S.markStart) + " — ] 로 끝 지정"); }
  else if (e.key === "]") {
    if (S.markStart == null || vid.currentTime <= S.markStart) return toast("먼저 [ 로 시작점을 지정하세요");
    S.marks.push([S.markStart, vid.currentTime]); S.markStart = null; S.dirty = true; refresh(); toast("이 구간은 컷에서 제외돼요");
  }
});
</script>
</body>
</html>
